# ===========================
# PRISM — Model Training Configuration
# ===========================

# ---- Audio Processing ----
audio:
  sample_rate: 16000
  channels: 1
  segment_duration: 3.0  # seconds
  overlap: 0.5           # seconds

# ---- Mel Spectrogram ----
spectrogram:
  n_mels: 128
  n_fft: 2048
  hop_length: 512
  f_min: 20
  f_max: 8000

# ---- Cough Detector (CNN) ----
cough_detector:
  architecture: "cnn_baseline"
  input_shape: [1, 128, 256]  # channels, n_mels, time_frames
  num_classes: 1              # binary cough detection (BCEWithLogitsLoss)
  learning_rate: 0.001
  batch_size: 128
  epochs: 50
  early_stopping_patience: 7
  optimizer: "adam"
  loss_function: "binary_cross_entropy"
  scheduler:
    type: "cosine_annealing"
    T_max: 50
  augmentation:
    time_mask: true
    freq_mask: true
    gaussian_noise: true
    noise_factor: 0.005

# ---- Temporal Transformer ----
temporal_transformer:
  input_features: 5       # cough_count, avg_duration, avg_intensity, night_ratio, inter_cough_interval
  d_model: 128
  n_heads: 4
  n_layers: 3
  d_ff: 256
  dropout: 0.1
  max_sequence_length: 30  # 30-day window
  num_classes: 4           # Stable, Improving, Increasing, Abnormal
  learning_rate: 0.0005
  batch_size: 16
  epochs: 100
  optimizer: "adamw"
  weight_decay: 0.01

# ---- Embedding Model ----
embeddings:
  dimension: 512
  model_type: "projection"

# ---- General Training ----
training:
  seed: 42
  device: "auto"           # auto, cpu, cuda, mps
  num_workers: 4
  pin_memory: true
  mixed_precision: true
  checkpoint_dir: "./models/checkpoints"
  log_dir: "./logs/training"
