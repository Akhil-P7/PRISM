# ===========================
# PRISM — Retrieval Configuration
# ===========================

# ---- TurboVec Vector Store (powered by Google's TurboQuant algorithm) ----
vector_store:
  index_path: "./vector_store"
  index_type: "TurboQuant"  # TurboQuant with IdMapIndex for stable IDs
  bit_width: 4              # 4-bit quantization (16x compression vs float32)
  embedding_dimension: 512
  similarity_metric: "inner_product"  # TurboQuant uses inner product natively

# ---- Retrieval Engine ----
retrieval:
  top_k: 5                    # number of similar cases to retrieve
  min_similarity_score: 0.7   # minimum similarity threshold
  max_results: 10

# ---- Memory Builder ----
memory:
  summary_max_length: 512     # max characters for memory summaries
  include_environmental: true
  include_temporal: true

# ---- Insight Generation ----
insight_generator:
  template_based: true        # Use template-based generation (Phase 1)
  llm_based: false            # Enable LLM-based generation (Phase 2)
  max_insight_length: 1024
