version: "3.8"

services:
  # ---- PRISM Backend API ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prism-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://prism:prism_secret@db:5432/prism
      - FAISS_INDEX_PATH=/app/vector_store
      - LOG_LEVEL=INFO
    volumes:
      - .:/app
      - vector_store:/app/vector_store
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - prism-network

  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    container_name: prism-db
    environment:
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: prism_secret
      POSTGRES_DB: prism
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - prism-network

  # ---- Streamlit Dashboard ----
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prism-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_HOST=backend
      - API_PORT=8000
    volumes:
      - .:/app
    depends_on:
      - backend
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    networks:
      - prism-network

volumes:
  postgres_data:
    driver: local
  vector_store:
    driver: local

networks:
  prism-network:
    driver: bridge